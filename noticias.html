<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notícias – GOTT | UFSC</title>
  <meta name="description" content="Notícias, eventos e comunicados do Grupo de Observação e Transformação do Território (GOTT/UFSC).">
  <meta name="theme-color" content="#4d4d4d">
  <link rel="canonical" href="https://gott.ufsc.br/noticias.html">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <meta property="og:title" content="Notícias – GOTT | UFSC">
  <meta property="og:image" content="https://gott.ufsc.br/assets/img/hero_bg.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="assets/js/tw-config.js"></script>
  <link rel="stylesheet" href="assets/css/style.css">
  <script defer src="https://unpkg.com/lucide@1.61.0/dist/umd/lucide.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/marked@18.1.1/lib/marked.umd.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/dompurify@3.4.17/dist/purify.min.js"></script>
  <script defer src="assets/js/app.js"></script>
  <script defer src="assets/js/noticias.js"></script>
</head>
<body data-page="noticias" class="font-body">
  <a href="#conteudo" class="skip-link">Pular para o conteúdo</a>
  <header id="site-header" class="site-header sticky top-0 z-50 h-[74px]"></header>

  <main id="conteudo">
    <section class="border-b-2 border-ink-text">
      <div class="wrap px-4 sm:px-6 lg:px-10 pt-12 lg:pt-16 pb-10 grid lg:grid-cols-12 gap-8 items-end">
        <div class="lg:col-span-8">
          <p class="label text-orange-deep mb-4"><a href="index.html" class="hover:underline">Início</a> / Comunicação</p>
          <h1 class="display" style="font-size:clamp(4rem,13vw,11rem)">Notícias<span class="text-orange-deep">.</span></h1>
        </div>
        <div class="lg:col-span-4">
          <label for="busca" class="label block mb-2">Buscar</label>
          <div class="relative">
            <i data-lucide="search" class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
            <input id="busca" type="search" class="field" placeholder="Título, texto ou tag" autocomplete="off">
          </div>
        </div>
      </div>
      <div class="wrap px-4 sm:px-6 lg:px-10 pb-8 flex gap-2 overflow-x-auto" id="filtros" aria-label="Filtrar por categoria"></div>
    </section>

    <section aria-live="polite">
      <p id="resultado" class="wrap px-4 sm:px-6 lg:px-10 py-4 label text-ink-soft border-b-2 border-ink-text"></p>
      <div id="lista" class="grid-lines grid sm:grid-cols-2 lg:grid-cols-3 border-b-2 border-ink-text">
        <div class="h-80 skeleton"></div><div class="h-80 skeleton"></div><div class="h-80 skeleton"></div>
      </div>
    </section>
  </main>

  <footer id="contato" class="bg-ink min-h-[400px]"></footer>
</body>
</html>
